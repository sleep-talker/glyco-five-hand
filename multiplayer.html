<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>지뢰 글리코 · 온라인 방 대전</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>body{background:#f8f2e9}.room-app{width:min(820px,calc(100% - 32px));margin:0 auto;padding:30px 0 60px}.room-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.room-head h1{font:30px 'Jua';margin:0}.room-head a{font-size:12px;color:#807973}.room-card{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:28px}.room-card h2{font:24px 'Jua';margin:0 0 8px}.room-card p{font-size:13px;color:#827a74;line-height:1.7}.room-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.room-form{border:1px solid var(--line);padding:19px;border-radius:14px}.room-form h3{font:18px 'Jua';margin:0 0 10px}.room-form input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:13px 'Gowun Dodum';margin:6px 0}.room-action{width:100%;margin-top:8px;border:0;border-radius:9px;padding:11px;background:var(--ink);color:white;font:14px 'Jua';cursor:pointer}.room-banner{display:flex;justify-content:space-between;align-items:center;background:#fff8e4;border:1px solid #f2dda8;border-radius:14px;padding:16px;margin-bottom:18px}.room-code{font:24px 'Jua';letter-spacing:3px;color:#c48e3f}.player-status{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.player-status>div{border-radius:12px;padding:13px;background:#faf8f5;font-size:12px}.player-status b{display:block;font:16px 'Jua';margin-bottom:5px}.ready{color:#458c59}.waiting{color:#a29a93}.online-card{border:1px solid var(--line);border-radius:14px;padding:17px}.online-card h3{font:19px 'Jua';margin:0 0 12px}.online-card input,.online-card textarea{width:100%;border:1px solid #e8e1d9;border-radius:9px;padding:10px;font:13px/1.55 'Gowun Dodum';box-sizing:border-box}.online-card textarea{min-height:95px;resize:vertical;margin-top:8px}.online-card button{margin-top:10px;border:0;border-radius:8px;background:var(--ink);color:white;padding:9px 12px;font:12px 'Jua';cursor:pointer}.online-card small{display:block;color:#999;margin-top:7px}.online-card .ok{color:#4d9360}.online-card .bad{color:#c55b4d}.battle-options{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.battle-options button{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:72px;font-family:inherit;cursor:pointer}.battle-options button.selected{border-color:var(--coral);background:var(--coral-light)}.ai-layer{position:fixed;inset:0;background:#28253248;display:grid;place-items:center;z-index:5}.ai-layer>div{background:#fffdf8;padding:25px;border-radius:17px;text-align:center;box-shadow:var(--shadow)}.spin{display:inline-block;width:22px;height:22px;border:3px solid #f3d492;border-top-color:#eb8c55;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:620px){.room-grid,.player-status{grid-template-columns:1fr}.room-card{padding:20px}}</style></head>
<body><main class="room-app"><header class="room-head"><h1>✦ 지뢰 글리코 온라인 대전</h1><a href="/">로컬 게임으로</a></header><div id="app"></div></main><div class="ai-layer hidden" id="busy"><div><i class="spin"></i><h3>AI 심판 판정 중</h3><p id="busyText">규칙을 분석하고 있어요…</p></div></div><script src="multiplayer.js"></script></body></html>
